async function gtMany(list,tl,sl){

  const asText=x=>Array.isArray(x)?asText(x[0]):(typeof x==="string"?x:null);
  // method 1: translate_a/t with many q= (one result per string)
  for(let i=0;i<list.length;i+=25){
    const part=list.slice(i,i+25);
    try{
      const body=part.map(s=>"q="+encodeURIComponent(s)).join("&");
      const r=await fetch("https://translate.googleapis.com/translate_a/t?client=gtx&dt=t&sl="+(sl||"auto")+"&tl="+tl,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded;charset=UTF-8"},body});
      if(r.ok){const d=await r.json();const arr=Array.isArray(d)?d:[d];
        if(arr.length===part.length)arr.forEach((x,k)=>{const s=asText(x);if(s)out[i+k]=s});
        else if(part.length===1&&asText(arr))out[i]=asText(arr)}
    }catch(e){}
  }
  // method 2: one string per request for anything still missing (small, sequential)
  for(let i=0;i<list.length;i++){
    if(out[i])continue;
    try{const r=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl="+(sl||"auto")+"&tl="+tl+"&q="+encodeURIComponent(list[i]));
      if(r.ok){const d=await r.json();const s=(d[0]||[]).map(p=>p[0]||"").join("").trim();if(s)out[i]=s}}catch(e){}
  }
  return out;
}
async function translateUI(code){
  const flat=[];const walk=(o,path)=>{for(const k in o){const v=o[k],pp=path.concat(k);if(typeof v==="string")flat.push([pp,v]);else walk(v,pp)}};walk(T.en,[]);
  const res=await gtMany(flat.map(x=>x[1]),code,"en");
  const ok=res.filter(Boolean).length;if(ok<flat.length*0.6)throw new Error("too few "+ok);
  const o=JSON.parse(JSON.stringify(T.en));
  flat.forEach(([pp],k)=>{if(!res[k])return;let x=o;for(let q=0;q<pp.length-1;q++)x=x[pp[q]];x[pp[pp.length-1]]=T.en[pp[0]]&&String(T.en[pp[0]]).includes("{lang}")&&!/\{lang\}/.test(res[k])?res[k].replace(/\{[^}]*\}/,"{lang}")+(/\{/.test(res[k])?"":" {lang}"):res[k]});
  ["svc","aiName"].forEach(k=>o[k].forEach((r,n)=>r[0]=T.en[k][n][0]));o.word="Word (.docx)";o.tg="Telegram";
  return o;
}

const TS=/^\s*\[?((?:\d{1,2}:)?\d{1,2}:\d{2})\]?\s*[-–—]?\s*/;
function parse(raw){
  const lines=raw.replace(/\r/g,"").split("\n").map(s=>s.trim());
  const hasHead=lines.some(l=>/^#{1,3}\s+\S/.test(l)||/^\*\*[^*]{2,80}\*\*:?$/.test(l));
  let title="",secs=[];
  if(hasHead){
    let s=null;
    for(let l of lines){
      if(!l)continue;
      let m;
      if((m=l.match(/^#\s+(.+)/))&&!title&&!secs.length){title=m[1].replace(/\*\*/g,"");continue}
      if((m=l.match(/^#{1,3}\s+(.+)/))||(m=l.match(/^\*\*([^*]{2,80})\*\*:?$/))){s={title:m[1].replace(/\*\*/g,"").replace(/:$/,""),items:[],kinds:[]};secs.push(s);continue}
      if(!s){s={title:T[L].text,items:[],kinds:[]};secs.push(s)}
      let kind="text";
      if(/^\d+[.)]\s+/.test(l)){kind="steps";l=l.replace(/^\d+[.)]\s+/,"")}
      else if(/^[-*•]\s+/.test(l)){kind="bullets";l=l.replace(/^[-*•]\s+/,"")}
      l=l.replace(/\*\*(.+?)\*\*/g,"$1");
      let t="";const tm=l.match(TS);if(tm&&toSec(tm[1])!=null){t=tm[1];l=l.slice(tm[0].length)}
      const am=kind==="bullets"&&l.match(/^(.{2,60}?)\s+[—–-]\s+(.{1,40})$/);
      s.items.push(am?{text:am[1],amount:am[2],t}:{text:l,t});s.kinds.push(kind);
    }
    secs=secs.filter(s=>s.items.length).map(s=>{const k=s.kinds.filter(x=>x!=="text");const main=k.length>=s.kinds.length/2?(k.filter(x=>x==="steps").length>k.length/2?"steps":"bullets"):"text";
      const hasAmt=s.items.some(i=>i.amount);return{title:s.title,kind:hasAmt?"checklist":main,items:s.items}});
  }else{
    const segs=[];let buf="",bt=null;
    let parts=[];
    const flush=()=>{if(buf.trim())segs.push({t:bt,text:buf.trim(),parts});buf="";bt=null;parts=[]};
    for(let i=0;i<lines.length;i++){
      let l=lines[i];if(!l)continue;
      let t=null;const tm=l.match(TS);
      if(tm&&toSec(tm[1])!=null){t=toSec(tm[1]);l=l.slice(tm[0].length)}
      else if(/^\d+$/.test(l)&&lines[i+1]&&/-->/.test(lines[i+1]))continue;
      else if(/-->/.test(l)){const m2=l.match(/(\d+):(\d{2}):(\d{2})/);if(m2){bt=bt??(+m2[1]*3600+ +m2[2]*60+ +m2[3])}continue}
      if(!l)continue;
      if(t!=null&&bt!=null&&t-bt>=15)flush();
      if(t!=null&&bt===null)bt=t;
      buf+=(buf?" ":"")+l;
      if(t!=null||!parts.length)parts.push({s:t,text:l});else parts[parts.length-1].text+=" "+l;
      if(buf.length>700||(bt===null&&/[.!?]$/.test(l)&&buf.length>350))flush();
    }
    flush();
    const timed=segs.some(s=>s.t!=null);
    const per=timed?180:6;const groups=[];
    segs.forEach((s,i)=>{const key=timed?Math.floor((s.t??0)/per):Math.floor(i/per);(groups[key]=groups[key]||[]).push(s)});
    secs=groups.filter(Boolean).map((g,i)=>{const a=g[0].t,b=g[g.length-1].t;
      return{title:timed?`${T[L].part} ${i+1} · ${fmt(a??0)}–${fmt(b??a??0)}`:`${T[L].part} ${i+1}`,kind:"text",items:g.map(s=>({text:s.text,t:s.t!=null?fmt(s.t):"",parts:s.parts&&s.parts.some(x=>x.s!=null)?s.parts:null}))}});
  }
  const icon=s=>{const x=s.title.toLowerCase();
    return /qisqa|кратк|summary|xulosa|вывод/.test(x)?"info":/masalliq|ингред|состав|kerak|нужн|tools/.test(x)?"basket":/tayyor|приготов|qadam|шаг|step/.test(x)?"steps":/maslahat|совет|tip/.test(x)?"tip":/ehtiyot|diqqat|внимани|осторож|warn/.test(x)?"warn":/asosiy|главн|main/.test(x)?"star":/videoda|происход/.test(x)?"play":s.kind==="checklist"?"basket":s.kind==="steps"?"steps":"text"};
  secs.forEach(s=>s.icon=icon(s));
  return{r:{title:title||T[L].types.other,type:"other",meta:[],sections:secs}};
}

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();

function zip(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;

    const name=enc.encode(f.name),data=typeof f.data==="string"?enc.encode(f.data):f.data,crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);
    parts.push(new Uint8Array(h.buffer),name,data);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),name);off+=30+name.length+data.length;
  }

const plain=el=>{const c=el.cloneNode(true);c.querySelectorAll(".ts").forEach(x=>x.remove());return c.textContent.replace(/\s+/g," ").trim()};
function chunks(s){const out=[];while(s.length>1800){let k=s.lastIndexOf(". ",1800);if(k<600)k=s.lastIndexOf(" ",1800);out.push(s.slice(0,k+1));s=s.slice(k+1)}if(s.trim())out.push(s);return out}
async function synth(text,eng,voice,rate){
  if(eng==="ms"){const r=await fetch(WORKER+"tts?voice="+encodeURIComponent(voice)+"&rate="+Math.round((rate-1)*100)+"&text="+encodeURIComponent(text));if(!r.ok)throw new Error("ms "+r.status);return {blob:await r.blob(),rate:1}}
  if(eng==="piper"){if(!piperMod){$("ttsSt").textContent=T[L].piperLoad;piperMod=await import("https://cdn.jsdelivr.net/npm/@diffusionstudio/vits-web@1.0.3/+esm")}
    const wav=await piperMod.predict({text,voiceId:voice});$("ttsSt").textContent="";return {blob:wav,rate}}
  return null;
}
function playBlob(b,rate,run){return new Promise((res,rej)=>{if(run!==ttsRun)return res();const a=new Audio(URL.createObjectURL(b.blob));a.playbackRate=b.rate===1?1:rate;audioEl=a;a.onended=()=>{URL.revokeObjectURL(a.src);res()};a.onerror=()=>rej(new Error("audio"));a.play().catch(rej)})}
function speakDev(text,voice,rate,run){return new Promise(res=>{if(run!==ttsRun)return res();const u=new SpeechSynthesisUtterance(text);const v=speechSynthesis.getVoices().find(x=>x.name===voice);if(v){u.voice=v;u.lang=v.lang}u.rate=rate;u.onend=res;u.onerror=res;speechSynthesis.speak(u)})}
async function readAll(){
  stopTTS();const run=++ttsRun,t=T[L];
  const eng=$("ttsEng").value,voice=$("ttsVoice").value,rate=+$("ttsRate").value;if(!voice){$("ttsSt").textContent=t.noVoice;return}
  const els=[...$("out").querySelectorAll(".body p,.body li")].filter(e=>plain(e));
  const jobs=[];els.forEach(el=>chunks(plain(el)).forEach(c=>jobs.push({el,c})));
  let next=jobs.length&&eng!=="dev"?synth(jobs[0].c,eng,voice,rate):null;
  for(let i=0;i<jobs.length&&run===ttsRun;i++){
    const j=jobs[i];document.querySelectorAll(".reading").forEach(e=>e.classList.remove("reading"));j.el.classList.add("reading");
    const d2=j.el.closest("details");if(d2&&!d2.open)d2.open=true;scrollUnder(j.el);
    try{
      if(eng==="dev"){await speakDev(j.c,voice,rate,run);continue}
      const b=await next;next=i+1<jobs.length?synth(jobs[i+1].c,eng,voice,rate):null;if(next)next.catch(()=>{});
      await playBlob(b,rate,run);
    }catch(e){if(run===ttsRun){$("ttsSt").textContent=t.ttsFail;stopTTS()}return}
  }
  if(run===ttsRun)document.querySelectorAll(".reading").forEach(e=>e.classList.remove("reading"));
}
/* ---------- text on screen (OCR in the browser, free) ---------- */
let tess=null,ocrAt=0,ocrText="";
const TL={en:"eng",ru:"rus",uz:"uzb",tr:"tur",kk:"kaz",ky:"kir",tg:"tgk",az:"aze",uk:"ukr",ar:"ara",fa:"fas",de:"deu",fr:"fra",es:"spa",pt:"por",it:"ita",zh:"chi_sim",ja:"jpn",ko:"kor",hi:"hin"};
function loadTess(){return tess||(tess=new Promise((res,rej)=>{if(window.Tesseract)return res(window.Tesseract);const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";s.onload=()=>res(window.Tesseract);s.onerror=()=>{tess=null;rej(new Error("load"))};document.head.appendChild(s)}))}
function openOcr(){ocrAt=curT;ytCmd("pauseVideo");$("ocr").hidden=false;$("ocrOut").hidden=true;$("ocrSt").textContent="";$("ocrFile").value=""}
$("ocrBtn").onclick=openOcr;$("ocrX").onclick=()=>$("ocr").hidden=true;
$("ocr").addEventListener("click",e=>{if(e.target===$("ocr"))$("ocr").hidden=true});
async function runOcr(file){
  const t=T[L];$("ocrSt").textContent=t.ocrRead;$("ocrOut").hidden=true;
  try{
    const Ts=await loadTess();
    const langs=[...new Set(["eng","rus",TL[(L||"en").split("-")[0]]].filter(Boolean))].join("+");
    const r=await Ts.recognize(file,langs);
    ocrText=(r.data.text||"").replace(/[ \t]+/g," ").replace(/\n{2,}/g,"\n").trim();
    if(!ocrText){$("ocrSt").textContent=t.ocrNone;return}
    let tr=ocrText;
    try{const q=await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&dt=t&tl="+L+"&q="+encodeURIComponent(ocrText.slice(0,4000)));const d=await q.json();tr=(d[0]||[]).map(p=>p[0]||"").join("").trim()||ocrText}catch(e){}
    $("ocrTrT").textContent=tr;$("ocrOrT").textContent=ocrText;$("ocrSt").textContent="";$("ocrOut").hidden=false;
    $("ocrAdd").textContent=t.ocrAdd+" ("+fmt(ocrAt)+")";$("ocrCopy").textContent=t.copy;
    $("ocrCopy").onclick=async()=>{if(await copy(tr))toast(t.copied)};
    $("ocrAdd").onclick=()=>{
      const line="["+fmt(ocrAt)+"] 🖼 "+tr.replace(/\n/g," ");
      const ls=$("txt").value.split("\n");let k=ls.length;
      for(let i=0;i<ls.length;i++){const m=ls[i].match(TS);if(m&&toSec(m[1])>ocrAt){k=i;break}}
      ls.splice(k,0,line);$("txt").value=ls.join("\n");$("ocr").hidden=true;$("make").click();toast(t.copied.replace(/.*/,"✓"));
    };
  }catch(e){$("ocrSt").textContent=t.ocrFail}
}
$("ocrFile").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(f)runOcr(f)});
addEventListener("paste",e=>{if($("ocr").hidden)return;const it=[...(e.clipboardData||{}).items||[]].find(x=>x.type.startsWith("image/"));if(it){e.preventDefault();runOcr(it.getAsFile())}});
/* ---------- follow the video (karaoke) ---------- */
let lastNow=null,lastLn=null,lastW=null,clk={t:0,at:0},lines=[],segList=[];
function indexLines(){
  lines=[...$("out").querySelectorAll(".ln")].map(el=>({el,a:+el.dataset.a,w:[...el.querySelectorAll(".wd")]}));
  lines.forEach((x,i)=>{const n=lines[i+1];const need=Math.max(1.2,x.w.reduce((s,w)=>s+w.textContent.length,0)*0.075+x.w.length*0.12);x.b=n&&n.a>x.a?Math.min(n.a,x.a+need):x.a+need});
  lines.forEach(x=>{const total=x.w.reduce((s,w)=>s+w.textContent.length+1,0)||1;let acc=0;x.ws=x.w.map(w=>{const s=x.a+(x.b-x.a)*acc/total;acc+=w.textContent.length+1;return s})});
  segList=[...$("out").querySelectorAll(".seg")];lastNow=lastLn=lastW=null;
}
const nowT=()=>clk.t+(playing?Math.min(0.6,(performance.now()-clk.at)/1000)*rate:0);
function scrollUnder(el){const topH=$("top").hidden?0:$("top").offsetHeight;const y=el.getBoundingClientRect().top+scrollY-topH-10;scrollTo({top:Math.max(0,y),behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"})}
let userScrollUntil=0;
["touchstart","wheel"].forEach(ev=>addEventListener(ev,()=>{userScrollUntil=performance.now()+4000},{passive:true}));
const followOn=()=>$("fol")&&$("fol").checked&&performance.now()>userScrollUntil;
function keepVisible(el){const topH=$("top").hidden?0:$("top").offsetHeight;const r=el.getBoundingClientRect();if(r.top<topH+4||r.bottom>innerHeight-70)scrollUnder(el)}
let dbgAt=0;
function tick(){
  requestAnimationFrame(tick);
  if(performance.now()-dbgAt>250){dbgAt=performance.now();const d=$("dbg");if(d)d.textContent=(clk.at?fmt(nowT()):"--:--")+(playing?" ▶":" ⏸")+(ytReady?" ✓":(clk.at?" ~":" ✗"))}
  if($("out").hidden||!clk.at)return;
  const ct=nowT();
  // paragraph highlight (yellow)
  const segs=segList;let best=null,bs=-1;
  for(const s of segs){const v=+s.dataset.sec;if(v<=ct+0.3&&v>=bs){bs=v;best=s}}
  if(best!==lastNow){if(lastNow)lastNow.classList.remove("now");lastNow=best;if(best){best.classList.add("now");const d2=best.closest("details");if(followOn()){if(d2&&!d2.open)d2.open=true;scrollUnder(best)}}}
  // line + word highlight
  if(!lines.length)return;
  let ln=null;for(const x of lines){if(x.a<=ct+0.15)ln=x;else break}
  if(ln&&ct>ln.b+1.5)ln=null;
  if(ln!==lastLn){
    if(lastLn){lastLn.el.classList.remove("cur");lastLn.w.forEach(w=>w.classList.remove("cw","nw","pw"))}
    lastLn=ln;lastW=null;
    if(ln){ln.el.classList.add("cur");if(followOn()){const par=lastNow&&lastNow.contains(ln.el)?lastNow:null;const room=innerHeight-($("top").hidden?0:$("top").offsetHeight)-80;if(!par||par.offsetHeight>room)setTimeout(()=>keepVisible(ln.el),700)}}
  }
  if(!ln)return;
  let k=0;for(let i=0;i<ln.ws.length;i++){if(ln.ws[i]<=ct)k=i;else break}
  if(k===lastW)return;lastW=k;
  ln.w.forEach((w,i)=>{w.classList.toggle("pw",i<k);w.classList.toggle("cw",i===k);w.classList.toggle("nw",i===k+1)});
  if(k+1>=ln.w.length){const nx=lines[lines.indexOf(ln)+1];if(nx&&nx.w[0])nx.w[0].classList.add("nw")}
}
requestAnimationFrame(tick);
function listen(){const w=$("yt").contentWindow;if(w)w.postMessage(JSON.stringify({event:"listening",id:1,channel:"widget"}),"*")}
$("yt").addEventListener("load",()=>{listen();setTimeout(listen,1000);setTimeout(listen,3000)});
addEventListener("message",e=>{
  if(!/youtube(-nocookie)?\.com$/.test(new URL(e.origin).hostname))return;
  let d;try{d=typeof e.data==="string"?JSON.parse(e.data):e.data}catch(_){return}
  if(!ytReady&&d&&d.info&&typeof d.info.playerState==="number"){playing=d.info.playerState===1;$("pp").textContent=playing?"⏸":"▶"}
  if(d&&d.info&&typeof d.info.playbackRate==="number"&&d.info.playbackRate!==rate){rate=d.info.playbackRate;$("spd").value=String(rate)}
  const ct=d&&d.info&&typeof d.info.currentTime==="number"?d.info.currentTime:null;
  if(ct!=null&&!ytReady){if(Math.abs(ct-clk.t)>0.01||!clk.at){curT=ct;clk={t:ct,at:performance.now()}}}
});
/* ---------- fixed player spacer ---------- */
const fitTop=()=>{const h=$("top").hidden?0:$("top").offsetHeight;$("spacer").style.height=h+"px";document.documentElement.style.scrollPaddingTop=(h+10)+"px"};
const roTop=new ResizeObserver(fitTop);roTop.observe($("top"));
new MutationObserver(fitTop).observe($("top"),{attributes:true,attributeFilter:["hidden","class"]});
addEventListener("resize",fitTop);
/* ---------- start ---------- */
function decode(h){const m=h.match(/[#&]d=([^&]+)/);if(!m)return null;
  try{let b=m[1].replace(/-/g,"+").replace(/_/g,"/");while(b.length%4)b+="=";return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0))))}catch(e){return null}}
const qs=new URLSearchParams(location.search);
const d=decode(location.hash);
if(d&&d.r){if(T[d.L])L=d.L;cur={r:d.r,full:d.full||null};play(d.v);ui();$("out").scrollIntoView({block:"start"})}
else{
  const v=vidOf(qs.get("v")||qs.get("url")||"")||(()=>{try{return localStorage.getItem("lv_vid")}catch(e){return null}})();
  if(v){$("link").value="https://youtu.be/"+v;play(v)}
  try{const x=localStorage.getItem("lv_txt");if(x){$("txt").value=x;$("c4").hidden=false}}catch(e){}
  ui();
}
if(want!==L)setLang(want);
const up=$("up");addEventListener("scroll",()=>{up.hidden=scrollY<500},{passive:true});up.onclick=()=>scrollTo({top:0});
}
