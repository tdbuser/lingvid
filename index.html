<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Lingvid — video va matn</title>
<meta name="description" content="Lingvid: YouTube video and its text on one page — contents, folding sections, time links, Word export.">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#f6b81c,#1d1420);--card:light-dark(#ffffff,#2a1f2e);--ink:light-dark(#2b1530,#f6eef7);--soft:light-dark(#6d5a70,#bfaec2);--line:light-dark(#eadfe9,#40324a);--acc:light-dark(#d8432b,#ff7a5c);--chip:light-dark(#fff3d1,#3a2b40)}
*{box-sizing:border-box;min-width:0}
html,body{overflow-x:hidden;max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 Nunito,system-ui,sans-serif;-webkit-text-size-adjust:100%}
.top{position:sticky;top:0;z-index:10;background:#000;box-shadow:0 4px 16px rgba(0,0,0,.35)}
.frame{position:relative;width:100%;max-width:720px;margin:0 auto;aspect-ratio:16/9;max-height:42vh;background:#000}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.top.min .frame{height:0;aspect-ratio:auto;overflow:hidden}
.bar{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px;padding:6px 14px;background:#120a14;color:#fff}
.bar .nm{flex:1;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{flex:none;min-height:38px;padding:0 12px;border:2px solid rgba(255,255,255,.35);border-radius:10px;background:transparent;color:#fff;font:700 14px Rubik,sans-serif;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:18px 14px 90px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
h1{font:700 clamp(34px,8vw,48px)/1 Rubik,sans-serif;margin:0;color:#2b1530;flex:1}
@media (prefers-color-scheme:dark){h1{color:#f6eef7}}
.lang{display:flex;border:2px solid rgba(43,21,48,.25);border-radius:12px;overflow:hidden;background:var(--card)}
.lang button{border:0;background:transparent;color:var(--ink);font:700 14px Nunito,system-ui,sans-serif;min-height:40px;padding:0 12px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--card)}
.lead{margin:6px 0 16px;font-weight:600;opacity:.85}
.card{background:var(--card);border-radius:22px;padding:clamp(16px,4vw,26px);box-shadow:0 10px 30px rgba(43,21,48,.16);margin-bottom:14px}
.step{display:flex;gap:12px;align-items:center;margin:0 0 12px}
.num{flex:none;width:36px;height:36px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font:700 18px Rubik}
.step h2{font:700 20px Rubik,sans-serif;margin:0}
input[type=text],textarea{width:100%;font:16px Nunito,sans-serif;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:transparent;color:var(--ink)}
textarea{min-height:170px;resize:vertical}
input:focus,textarea:focus,button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center}
.go{flex:1 1 160px;min-height:52px;border:0;border-radius:14px;background:var(--acc);color:#fff;font:700 17px Rubik,sans-serif;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.ghost{min-height:46px;border:2px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);font:700 15px Nunito,system-ui,sans-serif;padding:0 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.ghost svg,.go svg{width:20px;height:20px}
.hint{font-size:14px;color:var(--soft);margin:8px 0 0}
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.svc a{display:flex;gap:12px;align-items:center;padding:12px;border:2px solid var(--line);border-radius:16px;color:var(--ink);text-decoration:none}
.svc a:hover{border-color:var(--acc)}
.svc b{display:block;font-size:16px}.svc small{display:block;color:var(--soft);font-size:13px;line-height:1.3}
.ico{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff}
.ico svg{width:22px;height:22px}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-weight:700;z-index:30;max-width:90vw;text-align:center}
#out h2.tt{font:700 clamp(26px,5.5vw,34px)/1.1 Rubik,sans-serif;margin:0 0 10px}
#out,#out *{overflow-wrap:anywhere}
.toc{background:var(--chip);border-radius:16px;padding:12px 14px;margin:12px 0}
.toc b{display:block;margin-bottom:6px}.toc ol{margin:0;padding:0;list-style:none;display:grid;gap:2px}
.toc a{display:flex;gap:10px;align-items:center;color:var(--ink);text-decoration:none;font-weight:700;min-height:42px;padding:2px 6px;border-radius:10px}
.toc .ico{width:32px;height:32px;border-radius:9px}.toc .ico svg{width:18px;height:18px}
details.sec{border:2px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden}
details.sec>summary{list-style:none;display:flex;gap:12px;align-items:center;padding:10px 14px;cursor:pointer;font:700 18px Rubik,sans-serif;min-height:56px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::after{content:"▾";margin-left:auto;color:var(--soft)}
details.sec[open]>summary::after{content:"▴"}
details.sec[open]>summary{border-bottom:2px dashed var(--line)}
.sec .ico{width:34px;height:34px;border-radius:10px}.sec .ico svg{width:20px;height:20px}
.body{padding:6px 16px 14px}.body p{margin:8px 0}
ul.ck{list-style:none;margin:0;padding:0}
ul.ck li{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer;min-height:44px}
.box{flex:none;width:24px;height:24px;border:2px solid var(--soft);border-radius:7px;display:grid;place-items:center;font-size:15px;color:#fff}
li.done .box{background:var(--acc);border-color:var(--acc)}li.done>span:last-child{text-decoration:line-through;opacity:.5}
ol.st{list-style:none;margin:0;padding:0;counter-reset:s}
ol.st li{counter-increment:s;display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;padding:8px 0;cursor:pointer}
ol.st li::before{content:counter(s);width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--card);display:grid;place-items:center;font:700 16px Rubik}
ol.st li.done::before{content:"✓";background:var(--acc)}ol.st li.done>span{opacity:.5}
ul.bl{margin:0;padding-left:20px}ul.bl li{margin:6px 0}
.ts{display:inline-flex;align-items:center;margin:0 6px 0 0;padding:1px 10px;border-radius:999px;background:var(--acc);color:#fff;font-weight:700;font-size:13px;border:0;cursor:pointer;min-height:26px;vertical-align:1px;white-space:nowrap}
.back{display:inline-block;margin-top:8px;font-size:14px;font-weight:700;color:var(--soft);text-decoration:none}
mark{background:#ffe066;color:#2b1530;border-radius:3px}
#up{position:fixed;right:16px;bottom:20px;width:52px;height:52px;border-radius:50%;border:0;background:var(--ink);color:var(--card);font:700 22px Rubik;box-shadow:0 6px 18px rgba(0,0,0,.3);cursor:pointer;z-index:20}
footer{text-align:center;font-size:13px;color:#2b1530;opacity:.8;margin-top:20px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="top" id="top" hidden>
  <div class="frame"><iframe id="yt" title="YouTube" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
  <div class="bar"><div class="nm" id="nm"></div><button id="mn" type="button"></button></div>
</div>
<div class="wrap">
  <header><h1>Lingvid</h1>
    <div class="lang" role="group" aria-label="Til / Язык"><button type="button" data-l="uz" aria-pressed="true">O'zbekcha</button><button type="button" data-l="ru" aria-pressed="false">Русский</button></div>
  </header>
  <p class="lead" data-t="lead"></p>

  <section class="card">
    <div class="step"><span class="num">1</span><h2 data-t="s1"></h2></div>
    <input type="text" id="link" autocomplete="off" placeholder="https://youtu.be/...">
    <div class="row"><button class="go" id="open" type="button"></button></div>
  </section>

  <section class="card" id="c2">
    <div class="step"><span class="num">2</span><h2 data-t="s2"></h2></div>
    <div class="svc" id="svc"></div>
    <p class="hint" data-t="s2h"></p>
  </section>

  <section class="card">
    <div class="step"><span class="num">3</span><h2 data-t="s3"></h2></div>
    <textarea id="txt"></textarea>
    <div class="row"><button class="go" id="make" type="button"></button><button class="ghost" id="clr" type="button"></button></div>
    <p class="hint" data-t="s3h"></p>
  </section>

  <section class="card" id="c4" hidden>
    <div class="step"><span class="num">4</span><h2 data-t="s4"></h2></div>
    <p class="hint" style="margin:0 0 10px" data-t="s4h"></p>
    <div class="svc" id="ai"></div>
  </section>

  <section class="card" id="out" hidden></section>
  <footer>Lingvid · tdbuser.github.io/lingvid</footer>
</div>
<button id="up" type="button" aria-label="Yuqoriga" hidden>↑</button>
<div class="toast" id="toast" hidden></div>

<script>
{
const T={
uz:{lead:"YouTube video va uning matni bir sahifada: mundarija, ochiladigan bo'limlar, vaqt tugmalari, Word fayl. Bepul, ro'yxatdan o'tishsiz.",
 s1:"YouTube havolasini qo'ying",open:"▶ Videoni ochish",
 s2:"Video matnini oling (bepul servislar)",s2h:"Bu servislar o'z sahifasini boshqa saytlar ichida ko'rsatishga ruxsat bermaydi, shuning uchun yangi oynada ochiladi. Havola avtomatik nusxalanadi — u yerga qo'ying, matnni nusxalab, shu sahifaga qayting.",
 s3:"Matnni shu yerga qo'ying",make:"Tartibga solish",clr:"Tozalash",s3h:"Vaqtli matn ([0:12] yoki 0:12) bo'lsa — vaqt tugmalari videoni aynan shu joydan qo'yadi. Sarlavhali matn (#, 1., -) bo'limlarga ajratiladi.",
 s4:"Ma'noli tarjima va tahlil (ixtiyoriy)",s4h:"Topshiriq va matn nusxalanadi. Bepul sun'iy intellektni oching, qo'ying, javobini 3-qadamga qaytarib qo'ying — bo'limlarga ajratiladi.",
 toc:"Mundarija",back:"↑ Mundarijaga",open2:"Hammasini ochish",close:"Hammasini yopish",word:"Word (.docx)",copy:"Nusxa olish",tg:"Telegram",find:"Matndan qidirish…",
 hide:"▴ Yashirish",show:"▾ Videoni ko'rsatish",copied:"Nusxalandi ✓",linkCopied:"Havola nusxalandi — u yerga qo'ying",promptCopied:"Topshiriq va matn nusxalandi — u yerga qo'ying",badLink:"YouTube havolasini qo'ying",noText:"Avval matnni qo'ying",
 part:"Qism",text:"Matn",types:{other:"Video matni"},
 svc:[["DownSub","Matn + o'zbekchaga avto-tarjima"],["vidIQ Transcript","To'liq matn, vaqtlar bilan"],["YouTube","«…ещё» → «Показать текст видео»"]],
 aiName:[["Gemini","Google, bepul"],["ChatGPT","OpenAI, bepul"],["Claude","Anthropic, bepul"]],
 prompt:"Quyidagi YouTube video matnini o'zbek tilida (lotin) to'liq, tushunarli matnga aylantiring. So'zma-so'z emas, MA'NOSI bo'yicha tarjima qiling. Hech narsa o'ylab topmang. Tuzilishi: # Sarlavha, keyin ## Qisqacha (3-5 gap), ## bo'limlar (retsept bo'lsa: ## Masalliqlar — ro'yxat '- nomi — miqdori', ## Tayyorlash — '1. qadam'; yo'riqnoma bo'lsa: ## Kerakli narsalar, ## Qadamlar; boshqa bo'lsa: ## Asosiy fikrlar, ## Videoda nima bo'ladi, ## Xulosa). Agar matnda vaqtlar bo'lsa, har qadam boshida [m:ss] qoldiring.\n\nVIDEO: "},
ru:{lead:"Видео YouTube и его текст на одной странице: содержание, раскрывающиеся разделы, кнопки времени, файл Word. Бесплатно, без регистрации.",
 s1:"Вставьте ссылку YouTube",open:"▶ Открыть видео",
 s2:"Получите текст видео (бесплатные сервисы)",s2h:"Эти сервисы не разрешают показывать себя внутри других сайтов, поэтому открываются в новой вкладке. Ссылка копируется автоматически — вставьте её там, скопируйте текст и вернитесь сюда.",
 s3:"Вставьте текст сюда",make:"Разложить по полочкам",clr:"Очистить",s3h:"Если в тексте есть время ([0:12] или 0:12) — кнопки времени включают видео с этого места. Текст с заголовками (#, 1., -) делится на разделы.",
 s4:"Перевод по смыслу и анализ (по желанию)",s4h:"Задание и текст копируются. Откройте бесплатный ИИ, вставьте, а его ответ верните в шаг 3 — он разложится по разделам.",
 toc:"Содержание",back:"↑ К содержанию",open2:"Открыть все",close:"Свернуть все",word:"Word (.docx)",copy:"Копировать",tg:"Telegram",find:"Поиск по тексту…",
 hide:"▴ Скрыть",show:"▾ Показать видео",copied:"Скопировано ✓",linkCopied:"Ссылка скопирована — вставьте её там",promptCopied:"Задание и текст скопированы — вставьте там",badLink:"Вставьте ссылку YouTube",noText:"Сначала вставьте текст",
 part:"Часть",text:"Текст",types:{other:"Текст видео"},
 svc:[["DownSub","Текст + автоперевод на 100+ языков"],["vidIQ Transcript","Полный текст со временем"],["YouTube","«…ещё» → «Показать текст видео»"]],
 aiName:[["Gemini","Google, бесплатно"],["ChatGPT","OpenAI, бесплатно"],["Claude","Anthropic, бесплатно"]],
 prompt:"Преврати текст этого YouTube-видео в понятный полный текст на русском языке. Переводи по СМЫСЛУ, не дословно. Ничего не выдумывай. Структура: # Заголовок, затем ## Кратко (3-5 предложений), ## разделы (рецепт: ## Ингредиенты — список '- название — количество', ## Приготовление — '1. шаг'; инструкция: ## Что нужно, ## Шаги; другое: ## Главное, ## Что происходит в видео, ## Вывод). Если в тексте есть время, оставь [m:ss] в начале каждого шага.\n\nВИДЕО: "}
};
const IC={
 info:["#3a5bbf",'<circle cx="12" cy="12" r="9"/><path d="M12 8h.01M11 12h1v5h1"/>'],
 basket:["#2b7a6f",'<path d="M4 10h16l-2 9H6z"/><path d="M8 10l4-6 4 6"/>'],
 steps:["#d8432b",'<path d="M10 6h10M10 12h10M10 18h10"/><path d="M4 5l1-1v4M3.5 12.5c0-1 2-1 2 0s-2 1.5-2 2.5h2M3.5 17h2l-1 1.2c1 0 1 1.8 0 1.8h-1"/>'],
 tools:["#7a3b8f",'<path d="M14 7l3-3 3 3-3 3M14 7l-9 9 3 3 9-9"/>'],
 tip:["#c98a00",'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c1 1 1 2 1 3h6c0-1 0-2 1-3A6 6 0 0 0 12 3z"/>'],
 warn:["#b03a3a",'<path d="M12 3l10 18H2z"/><path d="M12 10v4M12 18h.01"/>'],
 star:["#c98a00",'<path d="M12 3l2.8 5.8 6.2.9-4.5 4.4 1 6.2L12 17.4 6.5 20.3l1-6.2L3 9.7l6.2-.9z"/>'],
 text:["#3a5bbf",'<path d="M5 5h14M5 10h14M5 15h10M5 20h7"/>'],
 check:["#2b7a6f",'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>'],
 time:["#7a3b8f",'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'],
 translate:["#b03a6a",'<path d="M4 5h8M8 3v2c0 4-2 7-5 8M6 9c1 2 3 3.5 5 4"/><path d="M13 21l4-9 4 9M14.5 18h5"/>'],
 play:["#d8432b",'<path d="M8 5v14l11-7z"/>'],
 box:["#2b7a6f",'<path d="M3 7l9-4 9 4-9 4zM3 7v10l9 4 9-4V7M12 11v10"/>'],
 heart:["#b03a6a",'<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>']
};

const svg=(k,c)=>`<svg viewBox="0 0 24 24" fill="none" stroke="${c||"currentColor"}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${(IC[k]||IC.info)[1]}</svg>`;
const ico=(k,bg)=>`<span class="ico" style="background:${bg||(IC[k]||IC.info)[0]}">${svg(k,"#fff")}</span>`;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const vidOf=u=>{const m=String(u).match(/(?:youtu\.be\/|v=|shorts\/|live\/|embed\/)([A-Za-z0-9_-]{11})/);return m?m[1]:null};
const toSec=t=>{const m=String(t||"").match(/^(\d+):(\d{2})(?::(\d{2}))?$/);if(!m)return null;return m[3]!=null?+m[1]*3600+ +m[2]*60+ +m[3]:+m[1]*60+ +m[2]};
const fmt=s=>{s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=String(s%60).padStart(2,"0");return h?`${h}:${String(m).padStart(2,"0")}:${x}`:`${m}:${x}`};
let L=(navigator.language||"").startsWith("ru")?"ru":"uz";try{L=localStorage.getItem("lv_lang")||L}catch(e){}
let curVid=null,cur=null;
const toast=m=>{const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)};
async function copy(s){try{await navigator.clipboard.writeText(s);return true}catch(e){const a=document.createElement("textarea");a.value=s;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand("copy")}catch(_){}a.remove();return ok}}

function ui(){
  const t=T[L];document.documentElement.lang=L;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t[e.dataset.t]);
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.l===L)));
  $("open").textContent=t.open;$("make").textContent=t.make;$("clr").textContent=t.clr;
  const v=curVid,yurl=v?"https://www.youtube.com/watch?v="+v:"https://www.youtube.com/";
  const S=[["https://downsub.com/?url="+encodeURIComponent(yurl),"translate","#2b7a6f"],["https://vidiq.com/youtube-transcript-generator/","text","#3a5bbf"],[yurl,"play","#d8432b"]];
  $("svc").innerHTML=S.map((s,i)=>`<a href="${esc(s[0])}" target="_blank" rel="noopener" data-copy="1">${ico(s[1],s[2])}<span><b>${esc(t.svc[i][0])} ↗</b><small>${esc(t.svc[i][1])}</small></span></a>`).join("");
  const A=[["https://gemini.google.com/app","#3a5bbf"],["https://chatgpt.com/","#2b7a6f"],["https://claude.ai/new","#c96442"]];
  $("ai").innerHTML=A.map((a,i)=>`<a href="${a[0]}" target="_blank" rel="noopener" data-ai="1">${ico("translate",a[1])}<span><b>${esc(t.aiName[i][0])} ↗</b><small>${esc(t.aiName[i][1])}</small></span></a>`).join("");
  $("svc").querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>{if(curVid){copy("https://www.youtube.com/watch?v="+curVid);toast(t.linkCopied)}}));
  $("ai").querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>{const x=$("txt").value.trim();copy(t.prompt+(curVid?"https://youtu.be/"+curVid:"")+"\n\n"+x);toast(t.promptCopied)}));
  if(cur)render();
  if(!$("top").hidden)$("mn").textContent=$("top").classList.contains("min")?t.show:t.hide;
}
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{L=b.dataset.l;try{localStorage.setItem("lv_lang",L)}catch(e){}ui()}));

function play(v){
  if(!v)return;curVid=v;$("top").hidden=false;$("top").classList.remove("min");
  $("yt").src="https://www.youtube.com/embed/"+v+"?enablejsapi=1&playsinline=1&rel=0&origin="+encodeURIComponent(location.origin);
  $("nm").textContent=(cur&&cur.r.title)||"YouTube";$("mn").textContent=T[L].hide;
  try{localStorage.setItem("lv_vid",v)}catch(e){}
}
$("mn").onclick=()=>{$("top").classList.toggle("min");$("mn").textContent=$("top").classList.contains("min")?T[L].show:T[L].hide};
$("open").onclick=()=>{const v=vidOf($("link").value);if(!v){toast(T[L].badLink);return}play(v);ui();scrollTo({top:0})};
$("link").addEventListener("keydown",e=>{if(e.key==="Enter")$("open").click()});
function seek(s){const w=$("yt").contentWindow;if(!w||$("top").hidden)return;$("top").classList.remove("min");$("mn").textContent=T[L].hide;
  const send=(f,a)=>w.postMessage(JSON.stringify({event:"command",func:f,args:a||[]}),"*");send("seekTo",[s,true]);send("playVideo")}

/* ---------- text -> sections ---------- */
const TS=/^\s*\[?((?:\d{1,2}:)?\d{1,2}:\d{2})\]?\s*[-–—]?\s*/;
function parse(raw){
  const lines=raw.replace(/\r/g,"").split("\n").map(s=>s.trim());
  const hasHead=lines.some(l=>/^#{1,3}\s+\S/.test(l)||/^\*\*[^*]{2,80}\*\*:?$/.test(l));
  let title="",secs=[];
  if(hasHead){
    let s=null;
    for(let l of lines){
      if(!l)continue;
      let m;
      if((m=l.match(/^#\s+(.+)/))&&!title&&!secs.length){title=m[1].replace(/\*\*/g,"");continue}
      if((m=l.match(/^#{1,3}\s+(.+)/))||(m=l.match(/^\*\*([^*]{2,80})\*\*:?$/))){s={title:m[1].replace(/\*\*/g,"").replace(/:$/,""),items:[],kinds:[]};secs.push(s);continue}
      if(!s){s={title:T[L].text,items:[],kinds:[]};secs.push(s)}
      let kind="text";
      if(/^\d+[.)]\s+/.test(l)){kind="steps";l=l.replace(/^\d+[.)]\s+/,"")}
      else if(/^[-*•]\s+/.test(l)){kind="bullets";l=l.replace(/^[-*•]\s+/,"")}
      l=l.replace(/\*\*(.+?)\*\*/g,"$1");
      let t="";const tm=l.match(TS);if(tm&&toSec(tm[1])!=null){t=tm[1];l=l.slice(tm[0].length)}
      const am=kind==="bullets"&&l.match(/^(.{2,60}?)\s+[—–-]\s+(.{1,40})$/);
      s.items.push(am?{text:am[1],amount:am[2],t}:{text:l,t});s.kinds.push(kind);
    }
    secs=secs.filter(s=>s.items.length).map(s=>{const k=s.kinds.filter(x=>x!=="text");const main=k.length>=s.kinds.length/2?(k.filter(x=>x==="steps").length>k.length/2?"steps":"bullets"):"text";
      const hasAmt=s.items.some(i=>i.amount);return{title:s.title,kind:hasAmt?"checklist":main,items:s.items}});
  }else{
    const segs=[];let buf="",bt=null;
    const flush=()=>{if(buf.trim())segs.push({t:bt,text:buf.trim()});buf="";bt=null};
    for(let i=0;i<lines.length;i++){
      let l=lines[i];if(!l)continue;
      let t=null;const tm=l.match(TS);
      if(tm&&toSec(tm[1])!=null){t=toSec(tm[1]);l=l.slice(tm[0].length)}
      else if(/^\d+$/.test(l)&&lines[i+1]&&/-->/.test(lines[i+1]))continue;
      else if(/-->/.test(l)){const m2=l.match(/(\d+):(\d{2}):(\d{2})/);if(m2){bt=bt??(+m2[1]*3600+ +m2[2]*60+ +m2[3])}continue}
      if(!l)continue;
      if(t!=null&&bt!=null&&t-bt>=40)flush();
      if(t!=null&&bt===null)bt=t;
      buf+=(buf?" ":"")+l;
      if(buf.length>700||(bt===null&&/[.!?]$/.test(l)&&buf.length>350))flush();
    }
    flush();
    const timed=segs.some(s=>s.t!=null);
    const per=timed?180:6;const groups=[];
    segs.forEach((s,i)=>{const key=timed?Math.floor((s.t??0)/per):Math.floor(i/per);(groups[key]=groups[key]||[]).push(s)});
    secs=groups.filter(Boolean).map((g,i)=>{const a=g[0].t,b=g[g.length-1].t;
      return{title:timed?`${T[L].part} ${i+1} · ${fmt(a??0)}–${fmt(b??a??0)}`:`${T[L].part} ${i+1}`,kind:"text",items:g.map(s=>({text:s.text,t:s.t!=null?fmt(s.t):""}))}});
  }
  const icon=s=>{const x=s.title.toLowerCase();
    return /qisqa|кратк|summary|xulosa|вывод/.test(x)?"info":/masalliq|ингред|состав|kerak|нужн|tools/.test(x)?"basket":/tayyor|приготов|qadam|шаг|step/.test(x)?"steps":/maslahat|совет|tip/.test(x)?"tip":/ehtiyot|diqqat|внимани|осторож|warn/.test(x)?"warn":/asosiy|главн|main/.test(x)?"star":/videoda|происход/.test(x)?"play":s.kind==="checklist"?"basket":s.kind==="steps"?"steps":"text"};
  secs.forEach(s=>s.icon=icon(s));
  return{r:{title:title||(L==="ru"?"Текст видео":"Video matni"),type:"other",meta:[],sections:secs}};
}

function tsBtn(t){const s=toSec(t);return s!=null?`<button class="ts" type="button" data-s="${s}">▶ ${esc(t)}</button>`:""}
function secBody(s){const it=s.items||[];
  if(s.kind==="checklist")return`<ul class="ck">${it.map(i=>`<li><span class="box">✓</span><span>${tsBtn(i.t)}${esc(i.text)}${i.amount?` — <b>${esc(i.amount)}</b>`:""}${i.note?` <i style="color:var(--soft)">(${esc(i.note)})</i>`:""}</span></li>`).join("")}</ul>`;
  if(s.kind==="steps")return`<ol class="st">${it.map(i=>`<li><span>${tsBtn(i.t)}${esc(i.text)}</span></li>`).join("")}</ol>`;
  if(s.kind==="bullets")return`<ul class="bl">${it.map(i=>`<li>${tsBtn(i.t)}${esc(i.text)}</li>`).join("")}</ul>`;
  return it.map(i=>`<p>${tsBtn(i.t)}${esc(i.text)}</p>`).join("");
}
function sectionsFlat(){const s=(cur.r.sections||[]).slice();if(cur.r.summary)s.unshift({icon:"info",title:L==="ru"?"Кратко":"Qisqacha",kind:"text",items:[{text:cur.r.summary}]});if(cur.full)s.push({icon:"translate",title:L==="ru"?"Полный текст":"To'liq matn",kind:"text",items:cur.full});return s}
function render(){
  const t=T[L],S=sectionsFlat();
  $("out").innerHTML=`<h2 class="tt">${esc(cur.r.title)}</h2>
   <input type="text" id="q" placeholder="${esc(t.find)}" style="margin-bottom:4px">
   <nav class="toc" id="toc"><b>${t.toc}</b><ol>${S.map((s,i)=>`<li><a href="#s${i}" data-i="${i}">${ico(s.icon)}<span>${i+1}. ${esc(s.title)}</span></a></li>`).join("")}</ol></nav>
   <div class="row" style="margin:0 0 4px"><button class="ghost" type="button" id="tog">${t.open2}</button></div>
   ${S.map((s,i)=>`<details class="sec" id="s${i}"${i===0?" open":""}><summary>${ico(s.icon)}<span>${i+1}. ${esc(s.title)}</span></summary><div class="body">${secBody(s)}<a class="back" href="#toc">${t.back}</a></div></details>`).join("")}
   <div class="row">
     <button class="go" type="button" id="dlw" style="flex:1 1 100%">${svg("text","#fff")} ${t.word}</button>
     <button class="ghost" type="button" id="cp">${t.copy}</button>
     <a class="ghost" id="tgl" target="_blank" rel="noopener" href="#">${t.tg} ↗</a>
   </div>`;
  $("out").hidden=false;
  if(!$("top").hidden)$("nm").textContent=cur.r.title;
  const plain=asText();
  $("tgl").href="https://t.me/share/url?url="+encodeURIComponent(curVid?"https://youtu.be/"+curVid:location.href)+"&text="+encodeURIComponent(plain.slice(0,3000));
  $("cp").onclick=async()=>{if(await copy(plain))toast(t.copied)};
  $("dlw").onclick=async()=>{const b=await buildDocx();const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=(cur.r.title||"Lingvid").replace(/[\\/:*?"<>|]+/g," ").slice(0,80)+".docx";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)};
  $("tog").onclick=()=>{const ds=[...$("out").querySelectorAll("details.sec")];const op=!ds.every(d=>d.open);ds.forEach(d=>d.open=op);$("tog").textContent=op?t.close:t.open2};
  $("q").oninput=e=>{const q=e.target.value.trim().toLowerCase();
    $("out").querySelectorAll("details.sec").forEach(d=>{const hit=q&&d.textContent.toLowerCase().includes(q);if(q)d.open=hit;
      d.querySelectorAll(".body p,.body li").forEach(el=>{el.style.background=q&&el.textContent.toLowerCase().includes(q)?"light-dark(#fff3c4,#4a3a20)":""})})};
}
$("out").addEventListener("click",e=>{
  const a=e.target.closest(".toc a");if(a){e.preventDefault();const d=$("s"+a.dataset.i);d.open=true;d.scrollIntoView({block:"start"});return}
  const bk=e.target.closest("a.back");if(bk){e.preventDefault();$("toc").scrollIntoView({block:"start"});return}
  const b=e.target.closest(".ts");if(b){seek(+b.dataset.s);return}
  const li=e.target.closest("ul.ck li, ol.st li");if(li)li.classList.toggle("done");
});
function asText(){const S=sectionsFlat();let o=cur.r.title+"\n"+(curVid?"https://youtu.be/"+curVid+"\n":"")+"\n";
  S.forEach((s,i)=>{o+=`\n${i+1}. ${s.title}\n`;(s.items||[]).forEach((it,j)=>{o+=(s.kind==="steps"?`${j+1}. `:s.kind==="text"?"":"• ")+(it.t?`[${it.t}] `:"")+it.text+(it.amount?` — ${it.amount}`:"")+"\n"})});return o}

$("make").onclick=()=>{const x=$("txt").value.trim();if(!x){toast(T[L].noText);return}
  cur=parse(x);render();$("c4").hidden=false;try{localStorage.setItem("lv_txt",x)}catch(e){}$("out").scrollIntoView({block:"start"})};

const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC[(c^b[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
function zip(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  for(const f of files){
    const name=enc.encode(f.name),data=typeof f.data==="string"?enc.encode(f.data):f.data,crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);
    parts.push(new Uint8Array(h.buffer),name,data);
    const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
    cen.push(new Uint8Array(c.buffer),name);off+=30+name.length+data.length;
  }
  const cs=cen.reduce((a,b)=>a+b.length,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,new Uint8Array(e.buffer)]);
}
function iconPng(k){return new Promise(res=>{
  const [col,p]=IC[k]||IC.info;
  const s=`<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 24 24"><rect width="24" height="24" rx="6" fill="${col}"/><g transform="translate(4 4) scale(.667)" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${p}</g></svg>`;
  const img=new Image();img.onload=()=>{const c=document.createElement("canvas");c.width=c.height=96;c.getContext("2d").drawImage(img,0,0,96,96);c.toBlob(b=>b?b.arrayBuffer().then(a=>res(new Uint8Array(a))):res(null),"image/png")};
  img.onerror=()=>res(null);img.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(s);
})}
const X=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");

async function buildDocx(){
  const t=T[L],r=cur.r,S=sectionsFlat(),rels=[],media=[];let rid=10,bm=1;
  const run=(txt,o={})=>`<w:r><w:rPr>${o.b?"<w:b/>":""}${o.c?`<w:color w:val="${o.c}"/>`:""}${o.sz?`<w:sz w:val="${o.sz}"/>`:""}${o.u?'<w:u w:val="single"/>':""}</w:rPr><w:t xml:space="preserve">${X(txt)}</w:t></w:r>`;
  const para=(inner,o={})=>`<w:p><w:pPr>${o.style?`<w:pStyle w:val="${o.style}"/>`:""}${o.sp?`<w:spacing w:after="${o.sp}"/>`:""}${o.ind?`<w:ind w:left="${o.ind}" w:hanging="${o.hang||0}"/>`:""}</w:pPr>${inner}</w:p>`;
  const ext=(url,txt)=>{const id="rId"+(rid++);rels.push(`<Relationship Id="${id}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/hyperlink" Target="${X(url)}" TargetMode="External"/>`);return`<w:hyperlink r:id="${id}">${run(txt,{c:"D8432B",u:1})}</w:hyperlink>`};
  const anc=(a,txt,o={})=>`<w:hyperlink w:anchor="${a}">${run(txt,{c:o.c||"2B5BBF",u:1,b:o.b})}</w:hyperlink>`;
  const mark=(name,inner)=>{const id=bm++;return`<w:bookmarkStart w:id="${id}" w:name="${name}"/>${inner}<w:bookmarkEnd w:id="${id}"/>`};
  const pics={};let dp=1;
  for(const s of S){if(!(s.icon in pics)){const png=await iconPng(s.icon);if(png){const n=media.length+1,id="rId"+(rid++);media.push({name:`word/media/i${n}.png`,data:png});rels.push(`<Relationship Id="${id}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/i${n}.png"/>`);pics[s.icon]={id,n}}else pics[s.icon]=null}}
  const pic=k=>{const p=pics[k];if(!p)return"";const e=320040;return`<w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${e}" cy="${e}"/><wp:docPr id="${dp++}" name="i${p.n}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="0" name="i${p.n}.png"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${p.id}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${e}" cy="${e}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r>${run("  ")}`};
  const tlink=tm=>{const s=toSec(tm);return curVid&&s!=null?run("  ")+ext(`https://www.youtube.com/watch?v=${curVid}&t=${s}s`,"▶ "+tm):""};
  let b=para(mark("top",run(r.title)),{style:"Title"});
  b+=para(run(t.types[r.type]||t.types.other,{b:1,c:"D8432B"}));
  (r.meta||[]).forEach(m=>m&&m.value&&(b+=para(run(m.label+": ",{b:1})+run(m.value),{sp:40})));
  if(curVid)b+=para(run("Video: ",{b:1})+ext("https://youtu.be/"+curVid,"https://youtu.be/"+curVid));
  b+=para(mark("toc",run(t.toc)),{style:"Heading1"});
  S.forEach((s,i)=>b+=para(pic(s.icon)+anc("sec"+i,`${i+1}. ${s.title}`),{sp:60}));
  S.forEach((s,i)=>{
    b+=para(mark("sec"+i,pic(s.icon)+run(`${i+1}. ${s.title}`)),{style:"Heading1"});
    (s.items||[]).forEach((it,j)=>{
      const extra=(it.amount?run(" — ")+run(it.amount,{b:1}):"")+(it.note?run(` (${it.note})`,{c:"6D5A70"}):"")+tlink(it.t);
      if(s.kind==="steps")b+=para(run(`${j+1}. `,{b:1,c:"D8432B"})+run(it.text)+extra,{ind:440,hang:440,sp:100});
      else if(s.kind==="checklist")b+=para(run("☐ ",{c:"D8432B"})+run(it.text)+extra,{ind:440,hang:440,sp:60});
      else if(s.kind==="text")b+=para((it.t&&s.icon==="translate"?ext(`https://www.youtube.com/watch?v=${curVid}&t=${toSec(it.t)||0}s`,`[${it.t}] `):"")+run(it.text)+(s.icon==="translate"?"":extra),{sp:160});
      else b+=para(run("• ",{c:"D8432B"})+run(it.text)+extra,{ind:440,hang:300,sp:60});
    });
    b+=para(anc("toc",t.back,{c:"6D5A70"})+run("    ")+anc("top",L==="ru"?"↑ В начало":"↑ Boshiga",{c:"6D5A70"}),{sp:200});
  });
  const NS='xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"';
  const doc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document ${NS}><w:body>${b}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:cs="Calibri" w:eastAsia="Calibri"/><w:sz w:val="24"/><w:lang w:val="${L==="ru"?"ru-RU":"uz-Latn-UZ"}"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:spacing w:after="120" w:line="300" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style><w:style w:type="paragraph" w:styleId="Title"><w:name w:val="Title"/><w:basedOn w:val="Normal"/><w:pPr><w:spacing w:after="200"/></w:pPr><w:rPr><w:b/><w:color w:val="2B1530"/><w:sz w:val="44"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:next w:val="Normal"/><w:pPr><w:keepNext/><w:spacing w:before="360" w:after="160"/><w:outlineLvl w:val="0"/></w:pPr><w:rPr><w:b/><w:color w:val="2B1530"/><w:sz w:val="32"/></w:rPr></w:style></w:styles>`;
  const files=[
    {name:"[Content_Types].xml",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`},
    {name:"_rels/.rels",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`},
    {name:"word/_rels/document.xml.rels",data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>${rels.join("")}</Relationships>`},
    {name:"word/document.xml",data:doc},{name:"word/styles.xml",data:styles},...media];
  return zip(files);
}

function decode(h){const m=h.match(/[#&]d=([^&]+)/);if(!m)return null;
  try{let b=m[1].replace(/-/g,"+").replace(/_/g,"/");while(b.length%4)b+="=";return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b),c=>c.charCodeAt(0))))}catch(e){return null}}
const qs=new URLSearchParams(location.search);
const d=decode(location.hash);
if(d&&d.r){L=d.L==="ru"?"ru":"uz";cur={r:d.r,full:d.full||null};play(d.v);ui();$("out").scrollIntoView({block:"start"})}
else{

  ui();
}
